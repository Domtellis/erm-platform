<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERM Platform — SB-01 Prototype</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">⬡</span>
                    <span class="logo-text">ERM</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#home" class="nav-item active" data-screen="home">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">Home</span>
                </a>
                <a href="#breaches" class="nav-item" data-screen="breaches-list">
                    <span class="nav-icon">⚠️</span>
                    <span class="nav-label">Breaches</span>
                    <span class="nav-badge">3</span>
                </a>
                <a href="#risk" class="nav-item" data-screen="risk">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Risk</span>
                </a>
                <a href="#controls" class="nav-item" data-screen="controls">
                    <span class="nav-icon">🛡️</span>
                    <span class="nav-label">Controls</span>
                </a>
                <a href="#monitoring" class="nav-item" data-screen="monitoring">
                    <span class="nav-icon">📡</span>
                    <span class="nav-label">Monitoring</span>
                </a>
                <a href="#decisions" class="nav-item" data-screen="decisions">
                    <span class="nav-icon">✅</span>
                    <span class="nav-label">Decisions</span>
                    <span class="nav-badge warning">1</span>
                </a>
                <a href="#actions" class="nav-item" data-screen="actions">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">Actions</span>
                </a>
                <a href="#reports" class="nav-item" data-screen="reports">
                    <span class="nav-icon">📄</span>
                    <span class="nav-label">Reports</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#admin" class="nav-item" data-screen="admin">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Admin</span>
                </a>
                <div class="user-profile">
                    <div class="avatar">SJ</div>
                    <div class="user-info">
                        <span class="user-name">Sarah Jones</span>
                        <span class="user-role">Risk Lead</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <div class="breadcrumbs" id="breadcrumbs">
                    <span class="breadcrumb-item">Home</span>
                </div>
                <div class="header-actions">
                    <div class="search-box">
                        <input type="text" placeholder="Search cases, decisions, actions..." class="search-input">
                    </div>
                    <button class="btn btn-icon">
                        <span>🔔</span>
                        <span class="notification-dot"></span>
                    </button>
                </div>
            </header>

            <!-- Screen Container -->
            <div class="screen-container" id="screen-container">
                <!-- Screens will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Modal Title</h3>
                <button class="btn btn-icon modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-content" id="modal-content">
                <!-- Modal content loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
