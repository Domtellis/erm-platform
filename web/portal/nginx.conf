server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker internal DNS — defers upstream resolution to request time (not startup)
    resolver 127.0.0.11 valid=30s;

    # Proxy Keycloak through HTTPS — avoids mixed content from the portal
    location ~ ^/(realms|admin|js|welcome)/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 5180;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # API proxies — all services same HTTPS origin, no mixed content, no CORS
    location /api/monitoring/ {
        set $svc http://monitoring-service:4010;
        rewrite ^/api/monitoring/(.*) /$1 break;
        proxy_pass $svc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/decisioning/ {
        set $svc http://decisioning-service:4011;
        rewrite ^/api/decisioning/(.*) /$1 break;
        proxy_pass $svc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/audit/ {
        set $svc http://audit-service:4013;
        rewrite ^/api/audit/(.*) /$1 break;
        proxy_pass $svc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ai/ {
        set $svc http://ai-risk-service:4014;
        rewrite ^/api/ai/(.*) /$1 break;
        proxy_pass $svc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control for static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
