## Role Definitions

| Role | Primary Responsibility |
|------|------------------------|
| **Chief Risk Officer (CRO)** | Overall risk governance, AI policy oversight |
| **CISO** | Information security, data privacy, vendor risk |
| **CEO** | Strategic direction, ultimate accountability |
| **CFO** | Financial approval, budget authority |
| **CTO** | Technology strategy, architecture decisions |
| **VP Product** | Product roadmap, feature prioritization |
| **VP Engineering** | Engineering delivery, technical execution |
| **VP Risk** | Day-to-day risk operations |
| **AI Oversight Lead** | **[NEW]** AI model management, bias monitoring, prompt engineering |
| **Product Owner** | Specific product backlog and delivery |
| **Risk Lead** | Individual risk assessments (certified role) |
| **Operations Manager** | Day-to-day breach management |
| **Legal Counsel** | Contract review, regulatory compliance |
| **Privacy Officer** | GDPR compliance, data subject rights |

