# Decision Authority Matrix

**Purpose:** Define who has authority to make decisions across the ERM Platform  
**Owner:** Chief Risk Officer  
**Last Updated:** 2026-02-17

---

## AI/ML Decision Authorities

### Strategic & Governance

| Decision | Authority | Can Delegate? | Requires | Notes |
|----------|-----------|---------------|----------|-------|
| **Approve AI Governance Policy** | Chief Risk Officer | No | CISO + Legal review | Initial and annual renewal |
| **Deploy AI to POC** | VP Product + VP Risk | No | Deployment checklist completion | Pre-production testing |
| **Deploy AI to Production** | Chief Risk Officer + CISO | No | POC success metrics + checklist | Final gate before production |
| **Update AI Governance Policy** | Chief Risk Officer | No | Stakeholder review | Quarterly or ad-hoc |
| **Appoint AI Oversight Lead** | Chief Risk Officer | No | - | New role for AI management |
| **Suspend AI Service (Emergency)** | AI Oversight Lead OR CRO | No | - | Bias incident response |

###Model & Prompt Management

| Decision | Authority | Can Delegate? | Requires | Notes |
|----------|-----------|---------------|----------|-------|
| **Select AI Model** | VP Product + CTO + CRO | No | ADR approval | Initial model selection |
| **Change AI Model Version** | AI Oversight Lead | Yes (to Product Owner) | Validation testing | Minor version updates |
| **Change AI Provider** | CTO + CRO | No | New ADR, security review | Major change (e.g., Gemini → GPT) |
| **Update Prompt Template (Minor)** | AI Oversight Lead | Yes () | Testing on validation set | Wording, formatting |
| **Update Prompt Template (Major)** | Chief Risk Officer | No | Bias testing, CRO approval | Risk matrix changes, logic changes |
| **Add Synthetic Training Data** | AI Oversight Lead | Yes | Expert review | Expanding validation set |

### Operational Decisions

| Decision | Authority | Can Delegate? | Requires | Notes |
|----------|-----------|---------------|----------|-------|
| **Accept AI Risk Assessment** | Risk Lead | Never | - | Individual assessor authority |
| **Reject AI Risk Assessment** | Risk Lead | Never | - | Always allowed, no justification needed |
| **Override AI Assessment** | Any Risk Lead | Never | - | Human always has final say |
| **Configure AI Service** | AI Oversight Lead | Yes (to Ops Team) | - | Technical configuration |
| **API Key Rotation** | CISO | Yes (to Ops Team) | 90-day cycle | Security requirement |
| **Disable AI for Breach Type** | AI Oversight Lead OR CRO | Yes (emergency) | - | If bias detected for specific scenario |

### Compliance & Audit

| Decision | Authority | Can Delegate? | Requires | Notes |
|----------|-----------|---------------|----------|-------|
| **Approve Data Sent to External API** | Chief Risk Officer + CISO | No | Privacy Impact Assessment | Before POC |
| **Execute Data Processing Agreement** | Legal Counsel | No | CISO input | With Google/AI provider |
| **Classify Bias Incident Severity** | AI Oversight Lead | Yes (to CRO for Critical) | Incident classification matrix | Per runbook |
| **Approve AI for New Jurisdiction** | CISO + Legal | No | Regulatory review | Different data residency rules |
| **Define AI Success Metrics** | VP Product + CRO | No | - | KPIs for AI performance |

