## Delegation Rules

### When Delegation is Permitted

1. **Explicit Delegation:** Authority holder explicitly delegates to named individual
2. **Documented:** Delegation recorded in writing (email, system record)
3. **Time-Bound:** Delegation for finite period (e.g., "while I'm on vacation")
4. **Accountable:** Original authority holder remains accountable for outcomes

### Non-Delegable Decisions

Decisions marked "Cannot Delegate" can NEVER be delegated, even in emergencies. These are reserved for specific roles due to:
- Legal accountability
- Fiduciary responsibility
- Safety-critical nature
- Regulatory compliance

### Emergency Override

In life-threatening emergencies, ANY decision can be made by on-scene incident commander, with immediate notification to proper authority and post-incident review.

