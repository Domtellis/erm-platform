## Risk Assessment Decision Authorities

### Breach Management

| Decision | Authority | Can Delegate? | Requires | Notes |
|----------|-----------|---------------|----------|-------|
| **Create Breach Record** | System (automated) OR Operations Manager | Yes | Metric threshold exceeded | Triggered by monitoring |
| **Triage Breach** | Operations Manager | Yes (to Duty Manager) | Breach exists | Initial review |
| **Assign Risk Assessment** | Operations Manager | Yes (to Duty Manager) | Triaged breach | Assign to Risk Lead |
| **Complete Risk Assessment** | Risk Lead (certified) | No | Competency certification | Can use AI suggestion but not required |
| **Approve High/Critical Risk Assessment** | Chief Risk Officer OR Delegate | Yes (to Senior Risk Lead) | Risk Lead assessment complete | Approval workflow |

### Remediation & Closure

| Decision | Authority | Can Delegate? | Requires| Notes |
|----------|-----------|---------------|----------|-------|
| **Approve Remediation Plan** | Risk Lead | No | Risk assessment complete | Creates plan |
| **Approve High/Critical Remediation** | Chief Risk Officer | Yes (to VP Risk) | Risk Lead proposal | Budget approval |
| **Implement Remediation** | Site Manager | No | Approved plan | Local execution |
| **Close Breach** | Risk Lead | No | Remediation verified | Final closure |

