schema_version: "1.0"
blueprints:
  - blueprint_id: "BP-001"
    name: "Risk Appetite Definition & Approval"
    intent: "Translate appetite into executable criteria with approvals, versioning, and effective dates."
  - blueprint_id: "BP-002"
    name: "Committee Cycle & Decision Governance"
    intent: "Run committee cadence with agenda packs, decision log, actions, and follow-ups."
  - blueprint_id: "BP-003"
    name: "Risk Action Closure with Evidence"
    intent: "Ensure actions close on-time with required evidence and approvals (verified closure)."
  - blueprint_id: "BP-004"
    name: "KRI Monitoring & Breach Management"
    intent: "Detect threshold breaches, **AI-enrich triage with Gemini**, escalate via authority matrix, and create actions."
  - blueprint_id: "BP-005"
    name: "Audit Evidence Request Fulfilment"
    intent: "Respond to audit requests quickly with validated evidence packaging and traceable logs."
  - blueprint_id: "BP-006"
    name: "Tenant Provisioning & Access Administration"
    intent: "Provision tenant, seed taxonomies, establish LoD views, and enable everything-as-code."
