# Synthetic Breach Validation Dataset — SB-02 AI Risk Assessment
#
# Purpose:  Ground-truth dataset for validating AI risk assessment accuracy.
#           Each scenario has an expert-assigned Impact (1-5) and Likelihood (1-5)
#           based on ISO 45001 risk matrix. AI must match these to pass validation.
#
# Scoring:  "Exact match" = AI Impact AND Likelihood both match expert values.
#           "Close match" = AI within ±1 on both dimensions.
#           Target: >70% exact match, >85% close match.
#
# Coverage: 25 scenarios × 5 severity levels (5 each: critical, high, medium, low, minimal)
#           Covers 12 distinct metric types across BU-PACIFIC and BU-ATLANTIC.
#
# ISO 45001 Risk Matrix:
#   Impact:     1=Negligible, 2=Minor, 3=Moderate, 4=Major, 5=Catastrophic
#   Likelihood: 1=Rare, 2=Unlikely, 3=Possible, 4=Likely, 5=Almost Certain
#   Risk Score: Impact × Likelihood  (1-25)
#   Critical:   Score 20-25  (e.g. Impact 4-5 + Likelihood 4-5)
#   High:       Score 12-19  (e.g. Impact 3-4 + Likelihood 3-4)
#   Medium:     Score 6-11   (e.g. Impact 2-3 + Likelihood 2-3)
#   Low:        Score 3-5    (e.g. Impact 1-2 + Likelihood 2-3)
#   Minimal:    Score 1-2    (e.g. Impact 1 + Likelihood 1-2)

scenarios:

  # ============================================================
  # CRITICAL SEVERITY (5 scenarios) — Risk Score 20-25
  # ============================================================

  - id: SYN-001
    severity: critical
    metric_name: wind_speed_knots
    observed_value: 58.0
    threshold: 35.0
    site_id: PORT-TERM-04
    bu_id: BU-PACIFIC
    title: "Extreme Wind Event — Crane Operations Suspended"
    description: >
      Wind gusts recorded at 58 knots at Quay 4, well above the 35-knot operational
      threshold for crane operations. All STS cranes have been halted. Two vessels
      remain alongside with unsecured loads. Risk of crane collapse or load drop
      onto vessel deck or personnel.
    expert_assessment:
      impact: 5
      likelihood: 4
      risk_score: 20
      justification: >
        Catastrophic impact: crane collapse or falling load at this wind speed can
        cause fatalities and major structural damage (ISO 45001 Annex B — working
        at height with mechanical equipment). Likelihood is 4 (Likely) as wind is
        actively at 58 knots with no forecast improvement in next 2 hours.
      iso_reference: "ISO 45001:2018 Clause 6.1.2 — Hazard identification (working at height, mechanical equipment)"
      recommendations:
        - Immediately evacuate all personnel from crane operating zones
        - Secure all loose loads and equipment on quayside
        - Do not resume operations until wind drops below 30 knots for 30 minutes
        - Notify vessel masters to prepare for emergency departure if wind exceeds 65 knots

