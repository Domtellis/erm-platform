        loads). Likelihood is 3 (Possible) — stacks have been stable for 4 hours
        in good conditions, but risk increases with any ground vibration or wind.
      iso_reference: "ISO 45001:2018 Clause 6.1.2 — Stacking and storage hazards"
      recommendations:
