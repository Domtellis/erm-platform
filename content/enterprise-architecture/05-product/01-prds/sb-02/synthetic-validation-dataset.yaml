      likelihood: 5
      risk_score: 25
      justification: >
        Catastrophic impact: NaOH at this volume poses immediate chemical burn risk
        to personnel, potential fatalities if inhaled in confined spaces, and
        environmental contamination of harbour water (ISO 45001 Annex B — chemical
        hazards). Likelihood is 5 (Almost Certain) — the spill has already occurred
        and workers are already showing symptoms.
      iso_reference: "ISO 45001:2018 Clause 6.1.2 — Chemical hazards; Clause 8.2 — Emergency preparedness"
      recommendations:
        - Immediately evacuate 50m exclusion zone
        - Deploy HAZMAT team and chemical containment booms
        - Arrange medical assessment for all three affected workers
        - Notify environmental regulator within 1 hour (legal obligation)
        - Isolate storm drain to prevent harbour contamination

