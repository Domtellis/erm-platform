## Maintenance Windows

**Scheduled Maintenance:**
- **Frequency:** Monthly (first Sunday, 2am-4am local time)
- **Duration:** Max 2 hours
- **Notification:** 48 hours advance notice via email
- **Impact:** AI suggestions unavailable, manual assessment still works

**Emergency Maintenance:**
- **Approval:** CTO or AI Oversight Lead
- **Notification:** Immediate (via Slack + email)
- **Duration:** As short as possible, status updates every 30 minutes

---

## Monitoring & Alerting

### Real-Time Alerts

| Alert | Threshold | Notification Channel | Responsible |
|-------|-----------|----------------------|-------------|
| **AI Service Down** | Uptime = 0 for 5 min | PagerDuty | On-call Engineer |
| **High Latency** | p95 > 10s for 15 min | Slack #ai-alerts | AI Oversight Lead |
| **High Error Rate** | >10% API errors | Slack #ai-alerts | On-call Engineer |
| **Low Acceptance** | <50% for 7 days | Email to AI Oversight Lead | AI Oversight Lead |
| **Bias Alert** | Counterfactual test fails | Slack #ai-alerts + Email to CRO | AI Oversight Lead |

### SLA Reporting

**Weekly:** SLA compliance dashboard emailed to AI Oversight Lead + Product Owner  
**Monthly:** SLA review meeting with VP Product, CRO, AI Oversight Lead  
**Quarterly:** Executive SLA scorecard (uptime, latency, accuracy, bias incidents)

---

## SLA Exceptions

**Not Covered by SLA:**

1. **External Dependencies:**
   - Google Gemini API outage (not under our control)
   - Internet connectivity issues
   - User browser/network problems

2. **User Actions:**
   - Risk Lead chooses manual assessment (not AI failure)
   - User modifies AI suggestion (expected behavior, not "failure")

3. **Force Majeure:**
   - Natural disasters, war, pandemics
   - Government-mandated service shutdowns

4. **Security Incidents:**
   - Downtime due to active security threat mitigation

---

## SLA Review & Updates

**Quarterly Review:**
- Analyze actual performance vs. SLA targets
- Adjust targets if consistently exceeding (e.g., 99.9% uptime achieved → raise SLA)
- Adjust if consistently missing (realistic expectations)

**Annual Renegotiation:**
- Production SLA locked for 12 months
- After 12 months, VP Product + CRO can renegotiate

