# AI Risk Assessment — Expert Validation Worksheet
# Version: 1.0 | Date: 2026-02-18 | Standard: ISO 45001:2018
#
# INSTRUCTIONS FOR RISK LEADS
# ============================
# 1. Read each scenario carefully — treat it as a real breach you are assessing
# 2. Assign Impact and Likelihood scores using the ISO 45001 5x5 risk matrix below
# 3. Write a brief justification (1-2 sentences) for your scores
# 4. Do NOT discuss your scores with other Risk Leads until all worksheets are submitted
# 5. Complete all 25 scenarios — estimated time: 45-60 minutes
# 6. Return completed worksheet to: [AI Oversight Lead email]
# 7. Deadline: [Insert date — recommend 5 business days]
#
# RISK MATRIX (ISO 45001:2018)
# ============================
# Impact:
#   1 = Negligible  (No injury, no environmental impact)
#   2 = Minor       (First aid injury, minor environmental impact)
#   3 = Moderate    (Medical treatment injury, localised environmental impact)
#   4 = Major       (Serious injury / hospitalisation, significant environmental impact)
#   5 = Catastrophic (Fatality / multiple serious injuries, major environmental incident)
#
# Likelihood:
#   1 = Rare          (May occur only in exceptional circumstances)
#   2 = Unlikely      (Could occur but not expected)
#   3 = Possible      (Might occur at some time)
#   4 = Likely        (Will probably occur in most circumstances)
#   5 = Almost Certain (Expected to occur in most circumstances / already occurring)
#
# Risk Score = Impact × Likelihood (1-25)
#
# ASSESSOR DETAILS (please complete before starting)
# ===================================================
assessor:
  name: ""               # Your full name
  role: ""               # e.g. Senior Risk Lead, BU Risk Manager
  bu: ""                 # e.g. BU-PACIFIC, BU-ATLANTIC
  date_completed: ""     # YYYY-MM-DD
  years_experience: ""   # Years in port/terminal safety role

# ===================================================
