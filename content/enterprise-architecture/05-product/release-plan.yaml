      bu_ids: [BU-01]
      training: "ops/pilot/sb-01/onboarding.md"

  - name: v1
    id: r-v1
    objective: "Expand operational adoption and reduce manual effort with real integrations and richer reporting."
    scope_feature_ids:
      - F-06-01  # Real monitoring connector
      - F-06-02  # Optional ticketing integration
      - F-07-01  # SLA dashboards + trends
      - F-07-02  # Templates + guided forms
      - F-07-03  # Search/reporting improvements

  - name: v1.1
    id: r-v1-1
    objective: "Scale repeatability and automation across BUs and categories."
    scope_feature_ids:
      - F-08-01  # Rules-based auto escalation templates
      - F-08-02  # Action plan templates
      - F-08-03  # Bulk rollout tooling
      - F-08-04  # Cross-BU reporting

