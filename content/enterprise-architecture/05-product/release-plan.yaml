version: 0.1.1
product: ai-enabled-erm-platform

releases:
  - name: MVP
    id: r-mvp
    objective: "Run SB-01 end-to-end for BU-01 Safety breaches with AI-assisted triage and governance-grade auditability."
    scope_feature_ids:
      - F-01-01
      - F-01-02
      - F-01-03
      - F-02-01
      - F-02-02
      - F-03-01
      - F-03-02
      - F-03-03
      - F-04-01
      - F-04-02
      - F-04-03
      - F-04-04
      - F-05-01
      - F-06-01 # NEW: AI Triage
      - F-06-02 # NEW: Calibration Feedback
