# capability-taxonomy.yaml
schema_version: "1.0"
taxonomy:
  id: "ERM-L0"
  level: "L0"
  name: "AI-Enabled Enterprise Risk Management Platform"
  description: "Enterprise-wide capabilities to govern, sense, assess, treat, assure, monitor and report risk, with AI-enabled acceleration and controls."
  source: "User-provided ERM capability map"
  children:

    - id: "ERM-L1-01"
      level: "L1"
      name: "Risk Governance and Operating Model"
      children:
        - id: "ERM-L2-01.01"
          level: "L2"
          name: "Governance structures and decision rights"
          children:
            - id: "ERM-L3-01.01.01"
              level: "L3"
              name: "Committee and cadence management"
              scope: ["agenda packs", "actions", "minutes", "decision log"]
            - id: "ERM-L3-01.01.02"
              level: "L3"
              name: "Escalation and authority matrix"
              scope: ["thresholds", "approvals", "delegations"]
            - id: "ERM-L3-01.01.03"
              level: "L3"
              name: "Three-lines alignment"
              scope: ["role demarcation", "handoffs", "oversight views"]

        - id: "ERM-L2-01.02"
          level: "L2"
          name: "ERM policy, standards, and methodology"
          children:
            - id: "ERM-L3-01.02.01"
              level: "L3"
              name: "Policy library management"
              scope: ["versioning", "exceptions", "attestations"]
            - id: "ERM-L3-01.02.02"
              level: "L3"
              name: "Method configuration"
              scope: ["risk scales", "scoring logic", "criteria definitions"]
            - id: "ERM-L3-01.02.03"
              level: "L3"
              name: "ERM lifecycle definition"
              scope: ["states", "workflow", "SLAs"]

        - id: "ERM-L2-01.03"
          level: "L2"
          name: "Taxonomy and enterprise structures"
          children:
            - id: "ERM-L3-01.03.01"
              level: "L3"
              name: "Risk taxonomy management"
              scope: ["categories", "sub-types", "mapping rules"]
            - id: "ERM-L3-01.03.02"
              level: "L3"
              name: "Organisational modelling"
              scope: ["legal entities", "BUs", "regions", "functions"]
            - id: "ERM-L3-01.03.03"
              level: "L3"
              name: "Accountability modelling"
              scope: ["risk owners", "control owners", "approvers"]

    - id: "ERM-L1-02"
      level: "L1"
      name: "Risk Appetite, Risk Criteria, and Decision Guardrails"
      children:
        - id: "ERM-L2-02.01"
          level: "L2"
          name: "Appetite and tolerance definition"
          children:
            - id: "ERM-L3-02.01.01"
              level: "L3"
              name: "Appetite statements by risk class"
              scope: ["financial", "cyber", "safety", "compliance", "resilience"]
            - id: "ERM-L3-02.01.02"
              level: "L3"
              name: "Thresholds and limits"
              scope: ["tolerances", "triggers", "early warning bands"]
            - id: "ERM-L3-02.01.03"
              level: "L3"
              name: "Conditional appetite rules"
              scope: ["geography", "customer segment", "product line"]

        - id: "ERM-L2-02.02"
          level: "L2"
          name: "Risk criteria and evaluation rules"
          children:
            - id: "ERM-L3-02.02.01"
              level: "L3"
              name: "Impact/likelihood scales"
              scope: ["velocity", "persistence", "detectability"]
            - id: "ERM-L3-02.02.02"
              level: "L3"
              name: "Scoring model management"
              scope: ["qualitative", "semi-quant", "quant"]
            - id: "ERM-L3-02.02.03"
              level: "L3"
              name: "Acceptability rules"
              scope: ["acceptable", "treat", "avoid", "transfer"]

        - id: "ERM-L2-02.03"
          level: "L2"
          name: "Decision gating and approvals"
          children:
            - id: "ERM-L3-02.03.01"
              level: "L3"
              name: "Risk-based stage gates"
              scope: ["investment", "architecture", "go-live", "procurement"]
            - id: "ERM-L3-02.03.02"
              level: "L3"
              name: "Exception handling"
              scope: ["waivers", "time-bound approvals", "compensating controls"]
            - id: "ERM-L3-02.03.03"
              level: "L3"
              name: "Risk acceptance management"
              scope: ["sign-off", "expiry", "conditions", "renewals"]

    - id: "ERM-L1-03"
      level: "L1"
      name: "Risk Sensing and Context Intelligence"
      children:
        - id: "ERM-L2-03.01"
          level: "L2"
          name: "External risk intelligence"
          children:
            - id: "ERM-L3-03.01.01"
              level: "L3"
              name: "Horizon scanning"
              scope: ["regulatory", "geopolitical", "macro", "industry"]
            - id: "ERM-L3-03.01.02"
              level: "L3"
              name: "Threat intelligence ingestion"
              scope: ["cyber feeds", "advisories"]
            - id: "ERM-L3-03.01.03"
              level: "L3"
              name: "External signal triage"
              scope: ["materiality tagging", "routing"]

        - id: "ERM-L2-03.02"
          level: "L2"
          name: "Internal signal capture"
          children:
            - id: "ERM-L3-03.02.01"
              level: "L3"
              name: "Operational telemetry ingestion"
              scope: ["availability", "incidents", "performance"]
            - id: "ERM-L3-03.02.02"
              level: "L3"
              name: "Audit/assurance findings ingestion"
              scope: ["issues", "ratings", "themes"]
            - id: "ERM-L3-03.02.03"
              level: "L3"
              name: "Customer/complaint signals"
              scope: ["voice-of-customer", "service quality"]

        - id: "ERM-L2-03.03"
          level: "L2"
          name: "AI-enabled signal processing"
          children:
            - id: "ERM-L3-03.03.01"
              level: "L3"
              name: "NLP classification and deduplication"
              scope: ["theme extraction", "clustering"]
            - id: "ERM-L3-03.03.02"
              level: "L3"
              name: "Emerging risk detection"
              scope: ["trend breaks", "weak-signal surfacing"]
            - id: "ERM-L3-03.03.03"
              level: "L3"
              name: "Context packs for assessments"
              scope: ["auto-generated briefings", "sources"]

    - id: "ERM-L1-04"
      level: "L1"
      name: "Risk Identification and Portfolio Structuring"
      children:
        - id: "ERM-L2-04.01"
          level: "L2"
          name: "Risk intake and capture"
          children:
            - id: "ERM-L3-04.01.01"
              level: "L3"
              name: "Multi-channel intake"
              scope: ["forms", "email", "API", "chat", "ticketing"]
            - id: "ERM-L3-04.01.02"
              level: "L3"
              name: "Structured risk statement builder"
              scope: ["cause–event–impact"]
            - id: "ERM-L3-04.01.03"
              level: "L3"
              name: "Ownership and accountability assignment"
              scope: ["primary owners", "secondary owners"]

        - id: "ERM-L2-04.02"
