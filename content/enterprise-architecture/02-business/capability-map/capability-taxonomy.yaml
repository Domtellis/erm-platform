            - id: "ERM-L3-04.02.03"
              level: "L3"
              name: "Link to third parties"
              scope: ["suppliers", "partners", "outsourcers"]

        - id: "ERM-L2-04.03"
          level: "L2"
          name: "Portfolio rationalisation"
          children:
            - id: "ERM-L3-04.03.01"
              level: "L3"
              name: "Duplicate detection"
              scope: ["semantic similarity", "consolidation workflow"]
            - id: "ERM-L3-04.03.02"
              level: "L3"
              name: "Risk hierarchy"
              scope: ["parent/child", "systemic vs local"]
            - id: "ERM-L3-04.03.03"
              level: "L3"
              name: "Thematic clustering"
              scope: ["driver", "control family", "business domain"]

    - id: "ERM-L1-05"
      level: "L1"
      name: "Risk Assessment and Modelling"
      children:
        - id: "ERM-L2-05.01"
          level: "L2"
          name: "Risk analysis"
