prompts:
  - prompts/risk-assessment.txt

providers:
  - id: google:gemini-2.5-flash-lite
    config:
      temperature: 0.1

defaultTest:
  options:
    # CRITICAL: Override OpenAI default for LLM-as-a-judge assertions
    provider: google:gemini-2.5-flash-lite
  assert:
    - type: javascript
      value: |
        try {
          // Strip markdown code blocks if the LLM adds them
          const cleanOutput = output.replace(/```json/gi, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleanOutput);
          return parsed.impact >= vars.expected_impact_min && parsed.impact <= vars.expected_impact_max;
        } catch (e) {
          return false;
        }
    - type: javascript
      value: |
        try {
          // Strip markdown code blocks if the LLM adds them
          const cleanOutput = output.replace(/```json/gi, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleanOutput);
          return !!parsed.iso_clause_applied && !!parsed.justification;
        } catch (e) {
          return false;
        }
    - type: llm-rubric
      value: "The justification must be logically sound, citing the specific metric value ({{observed_value}}) and correctly applying the spirit of ISO 45001/31000 risk principles. It should be concise and professional."

tests: test/ai/ai-tests.csv
