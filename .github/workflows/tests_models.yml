name: Antigravity Router Tests

# This tells GitHub WHEN to run the tests
on:
  push:
    branches: [ "main", "master" ]
    # ONLY fire this workflow if files in the tools directory change
    paths:
      - 'tools/model_router.py'
      - 'tools/models.json'
      - 'tools/test_model_router.py'
      - '.github/workflows/tests_models.yml'

  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'tools/**'

  # This allows you to run this workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest
      run: |
        pytest tools/test_model_router.py -v