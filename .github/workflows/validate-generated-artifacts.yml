name: Validate generated artifacts

on:
  pull_request:
    paths:
      - 'docs/value-architecture/value-streams/**'
      - 'scripts/generate_value_streams.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Run generator
        run: |
          python scripts/generate_value_streams.py --source docs/value-architecture/value-streams --models models

      - name: Validate generated artifacts are up-to-date
        run: |
          # if generator produced changes to tracked files, fail the check so PR authors must run generator locally and include changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Generated artifacts are out of date. Please run 'python scripts/generate_value_streams.py' and commit regenerated files.";
            git --no-pager status --porcelain
            exit 1
          else
            echo "Generated artifacts are up-to-date.";
          fi
