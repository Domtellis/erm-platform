name: Generate Value Stream Artifacts

on:
  push:
    paths:
      - 'docs/value-architecture/value-streams/**.md'
  pull_request:
    paths:
      - 'docs/value-architecture/value-streams/**.md'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run generator
        run: |
          python scripts/generate_value_streams.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/**/context.yaml models/**/conceptual.mmd || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate value stream artifacts [skip ci]"
            git push
          fi
