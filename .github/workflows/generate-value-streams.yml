name: Generate Value Stream artifacts

on:
  push:
    paths:
      - 'docs/value-architecture/value-streams/**'
      - 'scripts/generate_value_streams.py'
  pull_request:
    paths:
      - 'docs/value-architecture/value-streams/**'
      - 'scripts/generate_value_streams.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Run generator
        run: |
          python scripts/generate_value_streams.py --source docs/value-architecture/value-streams --models models

      - name: Export draw.io and previews (SVG/HTML)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install mermaid-cli
        run: |
          npm install -g @mermaid-js/mermaid-cli
      - name: Run draw.io exporter
        run: |
          python scripts/export_drawio.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: regenerate value-stream model artifacts and draw.io exports"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
