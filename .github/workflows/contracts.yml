name: Contract & Architecture Validation

on:
  push:
    paths:
      - 'specs/**/*.yaml'
      - 'specs/**/*.json'
  pull_request:
    paths:
      - 'specs/**/*.yaml'
      - 'specs/**/*.json'

jobs:
  lint-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI Specs
        run: spectral lint specs/apis/*.yaml --ruleset .spectral.yaml

