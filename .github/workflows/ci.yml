name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.mmd'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.mmd'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install -g npm@latest
          npm ci --include=dev --legacy-peer-deps
          make install

      - name: Build Monorepo (Turbo)
        run: npm run build

      - name: Monorepo Audit (Lint + Test)
        run: |
          npm run lint
          npm run test

      - name: Lowercase repository owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            services/*/dist
            services/*/prisma
            services/*/schema.prisma
            services/*/migrations
            web/portal/dist
            web/portal/nginx.conf
          retention-days: 1

  package:
    name: Build & Push
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: appetite-and-criteria
            path: services/appetite-and-criteria
          - name: audit-and-reporting
            path: services/audit-and-reporting
          - name: decisioning-and-approvals
            path: services/decisioning-and-approvals
          - name: ai-risk-service
            path: services/erm-ai-risk-service
          - name: monitoring-and-breaches
            path: services/monitoring-and-breaches
          - name: notification-service
            path: services/notification-service
          - name: portal
            path: web/portal

    steps:
      - name: Checkout Code (for Dockerfiles)
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.path }}
          file: ./${{ matrix.path }}/Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ needs.verify.outputs.owner }}/erm-${{ matrix.name }}:latest
            ghcr.io/${{ needs.verify.outputs.owner }}/erm-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  deploy:
    name: Deploy to OCI
    needs: [verify, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "infra,policy,observability,web/portal/nginx.conf"
          target: "~/erm-platform"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/erm-platform
            
            # Sync Server Firewall — ensure insertion at top to override REJECT rules
            sudo iptables -I INPUT 1 -m state --state NEW -p tcp --match multiport --dports 5180,3000,8080,16686,8025,4010,4011,4012,4013,4014,4020 -j ACCEPT && sudo netfilter-persistent save
            
            # Login to GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Start the platform
            cd infra/local
            sudo docker-compose -f docker-compose.prod.yml pull
            sudo docker-compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            
            # Ensure Keycloak SSL is disabled for HTTP deployments (idempotent)
            sleep 15
            sudo docker exec erm-postgres psql -U postgres -d keycloak -c "UPDATE realm SET ssl_required='NONE' WHERE name='erm-platform';" || true
