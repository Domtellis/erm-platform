name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.mmd'
      - '.gitignore'
      - 'LICENSE'
      - 'tools/**'
      - '.github/workflows/tests_models.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.mmd'
      - '.gitignore'
      - 'LICENSE'
      - 'tools/**'
      - '.github/workflows/tests_models.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            appetite-and-criteria: ['services/appetite-and-criteria/**', 'package.json', 'package-lock.json']
            audit-and-reporting: ['services/audit-and-reporting/**', 'package.json', 'package-lock.json']
            decisioning-and-approvals: ['services/decisioning-and-approvals/**', 'package.json', 'package-lock.json']
            ai-risk-service: ['services/erm-ai-risk-service/**', 'package.json', 'package-lock.json']
            monitoring-and-breaches: ['services/monitoring-and-breaches/**', 'package.json', 'package-lock.json', 'infra/local/docker-compose.yml']
            notification-service: ['services/notification-service/**', 'package.json', 'package-lock.json', 'infra/local/docker-compose.yml']
            portal: ['web/portal/**', 'package.json', 'package-lock.json', 'infra/local/docker-compose.yml']

      - name: Debug Filter Outputs
        run: |
          echo "Changes detected: ${{ steps.filter.outputs.changes }}"
          echo "Monitoring changed: ${{ steps.filter.outputs.monitoring-and-breaches }}"
          echo "Notification changed: ${{ steps.filter.outputs.notification-service }}"

      - name: Generate Dynamic Matrix
        id: set-matrix
        run: |
          # Convert the paths-filter output array into a JSON array of objects for the matrix
          CHANGES='${{ steps.filter.outputs.changes }}'
          
          MATRIX_JSON=$(echo "$CHANGES" | jq -c '
            def get_path:
              if . == "appetite-and-criteria" then "services/appetite-and-criteria"
              elif . == "audit-and-reporting" then "services/audit-and-reporting"
              elif . == "decisioning-and-approvals" then "services/decisioning-and-approvals"
              elif . == "ai-risk-service" then "services/erm-ai-risk-service"
              elif . == "monitoring-and-breaches" then "services/monitoring-and-breaches"
              elif . == "notification-service" then "services/notification-service"
              elif . == "portal" then "web/portal"
              else empty end;
            map({name: ., path: get_path})
          ')
          
          echo "Generated Matrix: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Validate
    needs: detect-changes
    # Only run this job if the matrix is NOT an empty array
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # We only need to login if we are actually pushing (i.e., on 'push' to main)
        if: github.event_name == 'push'
        # This uses a simple shell retry loop to handle GHCR network blips
        run: |
          for i in {1..3}; do
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin && break || sleep 15;
          done

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          # CRITICAL FIX: Set context to the root directory to support NPM workspaces
          context: . 
          file: ./${{ matrix.path }}/Dockerfile.prod
          # CRITICAL SECURITY FIX: Only push to the registry if this is a merge/push to main.
          push: ${{ github.event_name == 'push' }}
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/erm-${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/erm-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to OCI
    needs: [detect-changes, build-and-push]
    # Only deploy on direct pushes to main when changes are actually detected
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Remote Audit, Cleanup, and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "--- 1. REMOTE AUDIT & CLEANUP ---"
            df -h /
            # Prune dangling images to keep the disk clean
            sudo docker image prune -f
            
            echo "--- 2. PREPARE ENVIRONMENT ---"
            mkdir -p ~/erm-platform
            sudo chown -R ${{ secrets.OCI_USER }}:${{ secrets.OCI_USER }} ~/erm-platform
            
            echo "--- 3. PULL & SURGICAL RESTART ---"
            cd ~/erm-platform
            # Pull only new versions of images
            sudo docker-compose -f docker-compose.prod.yml pull
            
            # Restart ONLY changed services (No --force-recreate)
            # This keeps your DB and Redpanda online if only code changed!
            sudo docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "--- 4. FINAL STATUS ---"
            sudo docker ps
            df -h /

      - name: Copy Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "infra,policy,observability,web/portal/nginx.conf"
          target: "/home/${{ secrets.OCI_USER }}/erm-platform"
          overwrite: true
          debug: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT: ${{ secrets.JIRA_PROJECT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GEMINI_API_KEY,JIRA_URL,JIRA_USER,JIRA_TOKEN,JIRA_PROJECT,DB_PASSWORD
          script: |
            cd ~/erm-platform
            
            # Sync Server Firewall — ensure insertion at top to override REJECT rules
            sudo iptables -I INPUT 1 -m state --state NEW -p tcp --match multiport --dports 5180,3000,8080,16686,8025,4010,4011,4012,4013,4014,4020 -j ACCEPT && sudo netfilter-persistent save
            
            # Login to GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Start the platform
            cd infra/local
            
            # Formulate .env file so docker-compose seamlessly injects secrets into containers
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            echo "GEMINI_MODEL=gemini-2.5-flash-lite" >> .env
            echo "JIRA_URL=$JIRA_URL" >> .env
            echo "JIRA_USER=$JIRA_USER" >> .env
            echo "JIRA_TOKEN=$JIRA_TOKEN" >> .env
            echo "JIRA_PROJECT=$JIRA_PROJECT" >> .env
            echo "DB_PASSWORD=${DB_PASSWORD:-password}" >> .env

            sudo docker-compose -f docker-compose.prod.yml pull
            
            # Ensure databases exist before starting dependent services
            sudo docker-compose -f docker-compose.prod.yml up -d postgres
            sleep 10
            sudo docker exec erm-postgres psql -U postgres -c "CREATE DATABASE audit;" || true
            sudo docker exec erm-postgres psql -U postgres -c "CREATE DATABASE ai_risk;" || true
            sudo docker exec erm-postgres psql -U postgres -c "CREATE DATABASE appetite;" || true

            sudo docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Verify Audit Service Health
            echo "Verifying Audit Service Health..."
            max_retries=30
            count=0
            until [ $(curl -s -o /dev/null -w "%{http_code}" http://localhost:4013/audit/health) -eq 200 ] || [ $count -eq $max_retries ]; do
              echo "Waiting for Audit service... ($count/$max_retries)"
              sleep 5
              count=$((count+1))
            done
            if [ $count -eq $max_retries ]; then
              echo "::error::Audit service failed health check!"
              sudo docker-compose -f docker-compose.prod.yml logs audit-service
              exit 1
            fi
            echo "Audit service is healthy."

            # Ensure Keycloak SSL is disabled for HTTP deployments (idempotent)
            sleep 15
            sudo docker exec erm-postgres psql -U postgres -d keycloak -c "UPDATE realm SET ssl_required='NONE' WHERE name='erm-platform';" || true