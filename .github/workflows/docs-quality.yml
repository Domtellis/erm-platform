name: docs-quality

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "adr/**"
      - ".github/**"
      - "README.md"

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli2
        run: npm i -g markdownlint-cli2

      - name: Run markdownlint
        run: |
          markdownlint-cli2 \
            "**/*.md" \
            "#node_modules" \
            "#exports"

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codespell
        run: pip install codespell

      - name: Run codespell
        run: |
          codespell \
            --check-filenames \
            --check-hidden \
            --skip="./.git,./exports,./node_modules,*package-lock.json,*playwright-report*,*.bak,*backups*" \
            --ignore-words-list="bu,lod,afterall,fulfilment,ot,bunded,anull" \
            .
